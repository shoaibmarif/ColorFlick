<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--seo-head-->
    <meta name="application-name" content="ColorFlick" />
    <meta name="apple-mobile-web-app-title" content="ColorFlick" />
    <meta name="author" content="Shoaib Arif" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <!-- Apply the saved theme before first paint to avoid a light/dark flash. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('colorGuessing.settings') || '{}');
          var t = s.theme || 'light';
          if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Analytics with Consent Mode: no analytics cookies until the visitor accepts. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      (function () {
        var granted = false;
        try {
          granted = localStorage.getItem('colorflick.consent') === 'granted';
        } catch (e) {}
        gtag('consent', 'default', {
          analytics_storage: granted ? 'granted' : 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          wait_for_update: 500
        });
      })();
      gtag('js', new Date());
      gtag('config', 'G-5E2CW60GBT');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5E2CW60GBT"></script>
  </head>
  <body>
    <div id="root"><!--seo-body--></div>
    <noscript>
      <p style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif">
        ColorFlick is an interactive game and needs JavaScript to play. Please enable JavaScript in your browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
