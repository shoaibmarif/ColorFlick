<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="25%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGlow)"/>

  <!-- Palette Wheel Rim -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.9" filter="url(#shadow)"/>

  <!-- Center Color Target Swatch -->
  <circle cx="64" cy="64" r="22" fill="#8b5cf6" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>

  <!-- Color Choice Dots -->
  <circle cx="64" cy="20" r="10" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
  <circle cx="108" cy="64" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="64" cy="108" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <circle cx="20" cy="64" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>

  <!-- Center Question Mark Icon / Target Sparkle -->
  <path d="M64 53 A5 5 0 0 1 68.5 58 C68.5 61 65.5 62.5 64 64.5 M64 71.5 L64.02 71.5" 
        stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>